<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{TITLE}} — Archive</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='80' font-family='Georgia,serif' font-weight='bold' fill='%23b4391c'%3E§%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <a href="../index.html" class="brand">
        <div class="brand__title">Archive</div>
        <div class="brand__subtitle">Documentation</div>
      </a>
      <nav data-nav></nav>
    </aside>

    <main class="main">
      <div class="doc-meta">
        <span>{{CATEGORY}}</span>
        <span>{{DATE}}</span>
        <span>{{READING_TIME}}</span>
      </div>

      <h1 class="doc-title">{{TITLE}}</h1>

      <p class="doc-lede">{{LEDE}}</p>

      <article class="prose">

        <p class="dropcap">{{FIRST_PARAGRAPH}}</p>

        <h2 id="section-1">First section</h2>
        <p>Content.</p>

        <h2 id="section-2">Second section</h2>
        <p>More content.</p>

      </article>

      <footer class="doc-footer">
        <span><a href="../index.html">← Back to index</a></span>
        <span>Last updated: {{DATE}}</span>
      </footer>
    </main>
  </div>

  <script src="../assets/js/site.js"></script>
</body>
</html>
